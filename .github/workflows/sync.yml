name: 同步并汉化上游插件

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取上游并翻译
        run: python translate.py

      - name: 有变化就提交
        run: |
          if [ -n "$(git status --porcelain YouTube.zh.lpx)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add YouTube.zh.lpx
            git commit -m "sync: 同步上游并汉化"
            git push
          else
            echo "没有变化"
          fi
